name: Project architecture governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .agents/architecture-governance-tools/package-lock.json
      - run: npm ci --prefix .agents/architecture-governance-tools --ignore-scripts
      - run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node .agents/architecture-governance-tools/architecture-check.mjs --require-active
          else
            node .agents/architecture-governance-tools/architecture-check.mjs
          fi
