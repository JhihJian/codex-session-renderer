<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 会话工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell" data-left="open" data-right="open" data-panel="thread">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button" id="toggleLeft" type="button" title="切换会话列表" aria-label="切换会话列表">☰</button>
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">C</span>
            <div class="brand-copy">
              <strong>Codex 会话工作台</strong>
              <span id="healthStatus">接口检查中</span>
            </div>
          </div>
        </div>

        <nav class="mobile-tabs" aria-label="移动端视图切换">
          <button class="mobile-tab" data-panel-target="sessions" type="button">会话</button>
          <button class="mobile-tab" data-panel-target="thread" type="button">内容</button>
          <button class="mobile-tab" data-panel-target="inspector" type="button">检查</button>
        </nav>

        <div class="topbar-actions">
          <button class="ghost-button" id="refreshButton" type="button" title="刷新会话列表">刷新</button>
          <button class="ghost-button" id="refreshRemoteButton" type="button" hidden>刷新远程</button>
          <button class="ghost-button" id="copyMarkdownButton" type="button" disabled>复制 Markdown</button>
          <button class="primary-button" id="downloadMarkdownButton" type="button" disabled>下载 Markdown</button>
          <button class="icon-button" id="toggleRight" type="button" title="切换检查器" aria-label="切换检查器">◫</button>
        </div>
      </header>

      <aside class="sidebar panel" id="sessionsPanel" aria-label="会话列表">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Sessions</p>
            <h1>会话列表</h1>
          </div>
          <span class="count-pill" id="sessionCount">0</span>
        </div>

        <div class="control-stack">
          <label class="field-label" for="sourceSelect">数据源</label>
          <select class="select-input" id="sourceSelect"></select>
          <div class="source-status" id="sourceStatus">读取数据源状态中</div>

          <label class="field-label" for="sessionSearch">搜索会话</label>
          <input class="text-input" id="sessionSearch" type="search" autocomplete="off" placeholder="标题、路径、项目..." />

          <label class="field-label" for="sessionTimeFilter">时间分类</label>
          <div class="segmented-control" id="sessionTimeFilter" role="tablist" aria-label="时间分类">
            <button class="segment-button active" type="button" data-session-time="realtime">实时</button>
            <button class="segment-button" type="button" data-session-time="day">一天</button>
            <button class="segment-button" type="button" data-session-time="earlier">更早</button>
          </div>

          <label class="field-label" for="sessionTypeFilter">会话类型</label>
          <select class="select-input" id="sessionTypeFilter">
            <option value="all">全部会话</option>
            <option value="project">项目会话</option>
            <option value="projectless">无项目会话</option>
            <option value="error">包含错误</option>
            <option value="tool">包含工具调用</option>
          </select>
        </div>

        <div class="session-list" id="sessionList" role="list"></div>
      </aside>

      <main class="thread-panel panel" id="threadPanel" aria-label="会话内容">
        <section class="thread-toolbar">
          <div class="thread-title-block">
            <p class="eyebrow" id="sessionMetaLabel">未选择</p>
            <h2 id="sessionTitle">选择一个会话</h2>
          </div>

          <div class="thread-controls">
            <div class="view-switch" role="tablist" aria-label="视图切换">
              <button class="view-tab active" id="compactViewButton" type="button" data-view-mode="compact">精简</button>
              <button class="view-tab" id="auditViewButton" type="button" data-view-mode="audit">Audit</button>
              <button class="view-tab" id="rawViewButton" type="button" data-view-mode="raw">Raw</button>
            </div>
            <input class="text-input compact" id="itemSearch" type="search" autocomplete="off" placeholder="搜索内容、命令、输出..." />
            <select class="select-input compact" id="itemTypeFilter">
              <option value="all">全部类型</option>
              <option value="message">用户/助手消息</option>
              <option value="tool">工具与命令</option>
              <option value="output">工具输出</option>
              <option value="reasoning">推理摘要</option>
              <option value="system">系统事件</option>
              <option value="error">错误事件</option>
            </select>
            <label class="toggle-control" id="importantOnlyControl">
              <input id="importantOnly" type="checkbox" />
              <span id="importantOnlyLabel">重要事件</span>
            </label>
          </div>
        </section>

        <section class="stats-strip" id="statsStrip" aria-label="会话统计"></section>

        <section class="thread-content" id="threadContent" tabindex="-1" hidden></section>
        <section class="compact-content" id="compactContent" tabindex="-1"></section>
        <section class="terminal-content" id="terminalContent" tabindex="-1" hidden></section>
        <section class="audit-content" id="auditContent" tabindex="-1" hidden></section>
        <section class="trace-content" id="traceContent" tabindex="-1" hidden></section>
        <section class="raw-content" id="rawContent" tabindex="-1" hidden></section>
      </main>

      <aside class="inspector panel" id="inspectorPanel" aria-label="详情和事件检查器">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Inspector</p>
            <h2>会话辅助</h2>
          </div>
          <button class="ghost-button small" id="copyRawButton" type="button" disabled>复制调试 JSON</button>
        </div>

        <section class="inspector-section" id="sessionDetails"></section>

        <section class="inspector-section" id="selectionDetails"></section>

        <section class="inspector-section">
          <div class="section-title-row">
            <h3 id="keyEventsTitle">关键事件</h3>
            <span class="count-pill" id="eventCount">0</span>
          </div>
          <div class="raw-event-list" id="rawEventList"></div>
          <button class="ghost-button full-width" id="showMoreEventsButton" type="button" hidden>显示更多事件</button>
        </section>

        <details class="inspector-section raw-preview-section" id="debugDetails">
          <summary>
            <span>调试 JSON</span>
            <span class="muted" id="selectedEventLabel">未选择</span>
          </summary>
          <div class="inspector-actions" id="inspectorActions"></div>
          <pre class="raw-preview" id="rawPreview">选择关键事件或 Audit 节点查看 JSON</pre>
        </details>
      </aside>

      <footer class="statusbar" aria-label="工作台状态">
        <span id="statusSource">数据源：读取中</span>
        <span id="statusSession">未选择会话</span>
        <span id="statusEvents">0 sessions</span>
        <span id="statusUpdated">只读浏览</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./vendor/markdown-it.min.js" defer></script>
    <script src="./app-format.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
